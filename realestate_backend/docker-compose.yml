services:
  # -------------------------
  # Business Postgres
  # -------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: identity-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  # -------------------------
  # Identity / Business Service
  # -------------------------
  career-compass-core-service:
    container_name: career-compass-core-service
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/clini-india/career-compass-core-service:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
